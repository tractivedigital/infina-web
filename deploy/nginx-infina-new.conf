# Needs sudo (one time). Forwards chatbot.infina.co.in/infina-new to the Next.js app on 127.0.0.1:3001.
# Installed as /etc/nginx/snippets/infina-new.conf and included once inside the existing HTTPS server block for
# chatbot.infina.co.in, ABOVE its generic "location /" (see deploy/sudo-setup.sh). It does not touch the backend routes.
# The "^~" prefix makes nginx pick this block before any regex location. Next.js (basePath) handles the trailing slash.

location ^~ /infina-new {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) so a visitor cannot spoof their IP for the rate limiter.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}
